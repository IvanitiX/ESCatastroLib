[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "escatastrolib"
dynamic = ["version"]
description = "Una librería de Python para consultar los datos del Catastro COMO OBJETOS. Incluye información geográfica."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache License (2.0)"}
authors = [
    { name = "Iván V.R", email = "IvanVR@protonmail.com" },
]
keywords = ["espana", "spain", "catastro", "gis"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Natural Language :: Spanish"
]

dependencies = [
    "requests",
    "xmltodict",
    "shapely>=2.0.0",
    "pyproj>=3.0.0",
]

[project.optional-dependencies]
export = ["pandas>=2.0", "pyarrow>=14.0"]
gis = ["fudgeo>=1.5", "pyshp>=3.0"]
all = ["pandas>=2.0", "pyarrow>=14.0", "fudgeo>=1.5", "pyshp>=3.0"]

[project.urls]
Documentation = "https://codeberg.org/IvanInVR/ESCatastroLib#readme"
Issues = "https://codeberg.org/IvanInVR/ESCatastroLib/issues"
Source = "https://codeberg.org/IvanInVR/ESCatastroLib"

[tool.hatch.version]
path = "src/escatastrolib/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
    "mypy>=1.0.0",
]

[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/escatastrolib tests}"

[tool.hatch.envs.hatch-test]
dependencies = [
    "pytest",
]

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.coverage.run]
source_pkgs = ["escatastrolib", "tests"]
branch = true
parallel = true
omit = [
    "src/escatastrolib/__about__.py",
]

[tool.coverage.paths]
escatastrolib = ["src/escatastrolib", "*/escatastrolib/src/escatastrolib"]
tests = ["tests", "*/escatastrolib/tests"]

[tool.coverage.report]
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
